version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vg-postgres
    environment:
      POSTGRES_USER: videogen
      POSTGRES_PASSWORD: videogen_dev
      POSTGRES_DB: videogen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videogen -d videogen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create-buckets:
    image: minio/mc:latest
    container_name: vg-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...' && sleep 2; done;
      /usr/bin/mc mb minio/videogen-assets --ignore-existing;
      /usr/bin/mc mb minio/videogen-videos --ignore-existing;
      /usr/bin/mc anonymous set public minio/videogen-assets;
      /usr/bin/mc anonymous set public minio/videogen-videos;
      echo 'Buckets created successfully';
      "

  ffmpeg:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    container_name: vg-ffmpeg
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./temp:/temp

volumes:
  postgres_data:
  redis_data:
  minio_data: